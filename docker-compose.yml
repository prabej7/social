

services:
  db:
    image: postgres:16.3
    container_name: social-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
  
  redis:
    image: redis:6.2-alpine
    container_name: redis-server
    restart: always
    ports:
      - "6380:6379"